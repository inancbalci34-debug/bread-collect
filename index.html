r Benutzername muss 3–20 Buchstaben, Zahlen oder _ haben.","Le nom doit faire 3–20 lettres, chiffres ou _.","O usuário deve ter 3–20 letras, números ou _.","Имя: 3–20 букв, цифр или _.","ユーザー名は3〜20文字の英数字と_。"],["That username is not allowed. Please pick another one.","Bu kullanıcı adına izin verilmiyor. Lütfen başka bir tane seç.","Ese nombre no está permitido. Elige otro.","Dieser Name ist nicht erlaubt. Bitte wähl einen anderen.","Ce nom n'est pas autorisé. Choisis-en un autre.","Esse nome não é permitido. Escolha outro.","Это имя запрещено. Выбери другое.","そのユーザー名は使えない。別のを選んで。"],["Please enter a valid email.","Lütfen geçerli bir e-posta gir.","Escribe un correo válido.","Bitte gib eine gültige E-Mail ein.","Entre un e-mail valide.","Digite um e-mail válido.","Введи правильную почту.","正しいメールを入力して。"],["Password must be at least 10 characters.","Şifre en az 10 karakter olmalı.","La contraseña debe tener al menos 10 caracteres.","Das Passwort braucht mindestens 10 Zeichen.","Le mot de passe doit faire au moins 10 caractères.","A senha precisa ter pelo menos 10 caracteres.","Пароль — минимум 10 символов.","パスワードは10文字以上。"],["Password is too long (max 128).","Şifre çok uzun (en fazla 128).","La contraseña es demasiado larga (máx. 128).","Das Passwort ist zu lang (max. 128).","Mot de passe trop long (max 128).","Senha longa demais (máx. 128).","Пароль слишком длинный (макс. 128).","パスワードが長すぎる（最大128）。"],["Use at least 3 of these: lowercase, UPPERCASE, numbers, symbols.","Şunlardan en az 3'ünü kullan: küçük harf, BÜYÜK harf, rakam, sembol.","Usa al menos 3 de: minúsculas, MAYÚSCULAS, números, símbolos.","Nutze mindestens 3 davon: Kleinbuchstaben, GROSSBUCHSTABEN, Zahlen, Symbole.","Utilise au moins 3 parmi : minuscules, MAJUSCULES, chiffres, symboles.","Use pelo menos 3 de: minúsculas, MAIÚSCULAS, números, símbolos.","Используй минимум 3 из: строчные, ЗАГЛАВНЫЕ, цифры, символы.","小文字・大文字・数字・記号のうち3種類以上を使って。"],["That password is too easy to guess.","Bu şifre tahmin edilmeye tá bloqueada unos minutos por contraseñas incorrectas.","Dieses Konto ist wegen falscher Passwörter ein paar Minuten gesperrt.","Ce compte est bloqué quelques minutes à cause de mauvais mots de passe.","Esta conta está travada por alguns minutos por senhas erradas.","Аккаунт заблокирован на несколько минут из-за неверных паролей.","パスワードの間違いで、このアカウントは数分ロック中。"],["Wrong email/username or password.","E-posta/kullanıcı adı veya şifre yanlış.","Correo/usuario o contraseña incorrectos.","E-Mail/Benutzername oder Passwort falsch.","E-mail/nom ou mot de passe incorrect.","E-mail/usuário ou senha errados.","Неверная почта/имя или пароль.","メール/ユーザー名かパスワードが違う。"],["Not logged in (session expired)","Giriş yapılmamış (oturum süresi doldu)","No has iniciado sesión (sesión caducada)","Nicht angemeldet (Sitzung abgelaufen)","Non connecté (session expirée)","Não conectado (sessão expirada)","Вход не выполнен (сессия истекла)","ログインしていない（セッション切れ）"],["Too many tries. Wait 15 minutes.","Çok fazla deneme. 15 dakika bekle.","Demasiados intentos. Espera 15 minutos.","Zu viele Versuche. Warte 15 Minuten.","Trop d'essais. Attends 15 minutes.","Tentativas demais. Espere 15 minutos.","Слишком много попыток. Подожди 15 минут.","試行が多すぎる。15分待って。"],["Current password is wrong.","Mevcut şifre yanlış.","La contraseña actual es incorrecta.","Das aktuelle Passwort ist falsch.","Le mot de passe actuel est faux.","A senha atual está errada.","Текущий пароль неверный.","現在のパスワードが違う。"],["New password must be different.","Yeni şifre farklı olmalı.","La nueva contraseña debe ser distinta.","Das neue Passwort muss anders sein.","Le nouveau mot de passe doit être différent.","A nova senha deve ser diferente.","Новый пароль должен отличаться.","新しいパスワードは別のにして。"],["Password is wrong.","Şifre yanlış.","La contraseña es incorrecta.","Das Passwort ist falsch.","Le mot de passe est faux.","A senha está errada.","Пароль неверный.","パスワードが違う。"],["Too many tries. Wait an hour.","Çok fazla deneme. Bir saat bekle.","Demasiados intentos. Espera una hora.","Zu viele Versuche. Warte eine Stunde.","Trop d'essais. Attends une heure.","Tentativas demais. Espere uma hora.","Слишком много попыток. Подожди час.","試行が多すぎる。1時間待って。"],["Username or recovery code is wrong.","Kullanıcı adı veya kurtarma kodu yanlış.","Usuario o código de recuperación incorrecto.","Benutzername oder Code falsch.","Nom ou code de récupération incorrect.","Usuário ou código de recuperação errado.","Неверное имя или код восстановления.","ユーザー名か回復コードが違う。"],["You've sent too many reports today.","Bugün çok fazla şikâyet gönderdin.","Hoy has enviado demasiadas denuncias.","Du hast heute zu viele Meldungen geschickt.","Tu as envoyé trop de signalements aujourd'hui.","Você enviou denúncias demais hoje.","Ты сегодня отправил слишком много жалоб.","今日は通報が多すぎる。"],["Player not found","Oyuncu bulunamadı","Jugador no encontrado","Spieler nicht gefunden","Joueur introuvable","Jogador não encontrado","Игрок не найден","プレイヤーが見つからない"],["Blocked","Engellendi","Bloqueado","Blockiert","Bloqué","Bloqueado","Заблокировано","ブロックされた"],["Save too big","Kayıt çok büyük","Guardado demasiado grande","Spielstand zu groß","Sauvegarde trop grande","Save grande demais","Сохранение слишком большое","セーブが大きすぎる"],["Hello. I am bread.","Merhaba. Ben ekmek.","Hola. Soy pan.","Hallo. Ich bin Brot.","Bonjour. Je suis du pain.","Olá. Eu sou pão.","Привет. Я хлеб.","こんにちは。パンです。"],["Yes?","Efendim?","¿Sí?","Ja?","Oui ?","Sim?","Да?","なに？"],["Do you need something?","Bir şey mi lazım?","¿Necesitas algo?","Brauchst du was?","Tu as besoin de quelque chose ?","Precisa de algo?","Тебе что-то нужно?","何か用？"],["I'm just a bread.","Ben sadece bir ekmeğim.","Solo soy un pan.","Ich bin nur ein Brot.","Je ne suis qu'un pain.","Sou só um pão.","Я просто хлеб.","ただのパンだよ。"],["Please stop clicking me.","Lütfen bana tıklamayı bırak.","Por favor, deja de hacerme clic.","Bitte hör auf, mich anzuklicken.","Arrête de cliquer sur moi, s'il te plaît.","Por favor, para de clicar em mim.","Пожалуйста, перестань на меня нажимать.","クリックするのやめて。"],["I'm not stale. This is my look.","Bayat değilim. Tarzım bu.","No estoy duro. Es mi estilo.","Ich bin nicht alt. Das ist mein Look.","Je ne suis pas rassis. C'est mon style.","Não estou velho. É meu estilo.","Я не чёрствый. Это мой стиль.","古くない。これが私のスタイル。"],["Your mom bought me from the corner shop.","Annen beni köşedeki bakkaldan aldı.","Tu madre me compró en la tienda de la esquina.","Deine Mutter hat mich im Laden an der Ecke gekauft.","Ta mère m'a acheté à l'épicerie du coin.","Sua mãe me comprou na padaria da esquina.","Твоя мама купила меня в магазине у дома.","お母さんが角の店で買ってきた。"],["They put me in the wrong bag.","Beni yanlış poşete koydular.","Me pusieron en la bolsa equivocada.","Sie haben mich in die falsche Tüte gesteckt.","On m'a mis dans le mauvais sac.","Me colocaram na sacola errada.","Меня положили не в тот пакет.","間違った袋に入れられた。"],["I have feelings too. Gluten-based, but feelings.","Benim de duygularım var. Glütenli ama duygu.","Yo también tengo sentimientos. Con gluten, pero sentimientos.","Ich habe auch Gefühle. Glutenbasiert, aber Gefühle.","J'ai des sentiments aussi. À base de gluten, mais des sentiments.","Eu também tenho sentimentos. À base de glúten, mas sentimentos.","У меня тоже есть чувства. Глютеновые, но чувства.","私にも気持ちがある。グルテン製だけど。"],["Say hi to my cousin, the bagel.","Kuzenim simite selam söyle.","Saluda a mi primo, el bagel.","Grüß meinen Cousin, den Bagel.","Dis bonjour à mon cousin, le bagel.","Manda um oi pro meu primo, o bagel.","Передай привет моему кузену, бейглу.","いとこのベーグルによろしく。"],["Nobody ever eats my end piece. Did you know that?","Kimse benim uç kısmımı yemiyor. Biliyor muydun?","Nadie se come mi punta. ¿Lo sabías?","Niemand isst jemals mein Endstück. Wusstest du das?","Personne ne mange jamais mon quignon. Tu le savais ?","Ninguém come a minha ponta. Sabia?","Никто никогда не ест мою горбушку. Знал?","誰も端っこを食べてくれない。知ってた？"],["I was supposed to be bought in pairs.","Aslında iki tane alınacaktım.","Se suponía que me comprarían de dos en dos.","Eigentlich sollte man mich im Doppelpack kaufen.","On devait m'acheter par deux.","Era pra me comprarem em dupla.","Меня должны были купить парой.","本当は2個セットで買われるはずだった。"],["Nobody dipped me in soup today.","Bugün kimse beni çorbaya banmadı.","Hoy nadie me mojó en la sopa.","Heute hat mich niemand in Suppe getunkt.","Personne ne m'a trempé dans la soupe aujourd'hui.","Ninguém me molhou na sopa hoje.","Сегодня меня никто не макал в суп.","今日は誰もスープにひたしてくれなかった。"],["I wanted to be a wrap.","Dürüm olmak istiyordum.","Yo quería ser un wrap.","Ich wollte ein Wrap sein.","Je voulais être un wrap.","Eu queria ser um wrap.","Я хотел быть шаурмой.","ラップサンドになりたかった。"],["If I fall on the floor, kiss me and put me somewhere high, okay?","Yere düşersem öp, yüksek bir yere koy, tamam mı?","Si me caigo al suelo, bésame y ponme en un sitio alto, ¿vale?","Wenn ich runterfalle, küss mich und leg mich hoch, okay?","Si je tombe par terre, embrasse-moi et pose-moi en hauteur, d'accord ?","Se eu cair no chão, me beija e me põe num lugar alto, tá?","Если я упаду на пол, поцелуй меня и положи повыше, ладно?","床に落ちたら、キスして高いところに置いてね。"],["Don't touch me, your hands are greasy.","Dokunma bana, ellerin yağlı.","No me toques, tienes las manos grasientas.","Fass mich nicht an, deine Hände sind fettig.","Ne me touche pas, tes mains sont grasses.","Não me toca, suas mãos estão engorduradas.","Не трогай меня, у тебя жирные руки.","さわらないで、手が油っぽい。"],["My dream is to be a bread sandwich.","Hayalim ekmek arası ekmek olmak.","Mi sueño es ser un sándwich de pan.","Mein Traum ist ein Brot-Sandwich.","Mon rêve, c'est d'être un sandwich au pain.","Meu sonho é ser um sanduíche de pão.","Моя мечта — стать бутербродом из хлеба.","夢はパンのサンドイッチになること。"],["Okay, I'm here.","Tamam, buradayım.","Vale, aquí estoy.","Okay, ich bin da.","D'accord, je suis là.","Tá, estou aqui.","Ладно, я здесь.","はい、ここにいるよ。"],["The day I came out of the oven was so warm. Good times.","Fırından çıktığım gün çok sıcaktı. Güzel günlerdi.","El día que salí del horno hacía tanto calor. Buenos tiempos.","Der Tag, an dem ich aus dem Ofen kam, war so warm. Schöne Zeiten.","Le jour où je suis sorti du four, il faisait si chaud. Belle époque.","O dia em que saí do forno foi tão quentinho. Bons tempos.","В день, когда я вышел из печи, было так тепло. Хорошие времена.","オーブンから出た日はあったかかった。いい時代だった。"],["I'm 40% air and 60% confidence.","%40 hava, %60 özgüvenim.","Soy 40% aire y 60% confianza.","Ich bin 40 % Luft und 60 % Selbstbewusstsein.","Je suis 40 % d'air et 60 % de confiance.","Sou 40% ar e 60% confiança.","Я на 40% воздух и на 60% уверенность.","40%は空気、60%は自信。"],["Am I a loaf or a lifestyle?","Ben bir somun muyum yoksa bir yaşam tarzı mı?","¿Soy una hogaza o un estilo de vida?","Bin ich ein Laib oder ein Lebensstil?","Suis-je une miche ou un style de vie ?","Sou um pão ou um estilo de vida?","Я буханка или образ жизни?","私はパン？それともライフスタイル？"],["It's {hm} in {city}. Why are you awake?","{city}'da saat {hm}. Niye uyanıksın?","Son las {hm} en {city}. ¿Por qué estás despierto?","In {city} ist es {hm}. Warum bist du wach?","Il est {hm} à {city}. Pourquoi tu es réveillé ?","São {hm} em {city}. Por que você está acordado?","В {city} сейчас {hm}. Почему ты не спишь?","{city}は今{hm}。なんで起きてるの？"],["Shh. The other breads are sleeping.","Şşş. Diğer ekmekler uyuyor.","Shh. Los otros panes duermen.","Pssst. Die anderen Brote schlafen.","Chut. Les autres pains dorment.","Shh. Os outros pães estão dormindo.","Тсс. Остальные хлеба спят.","しーっ。他のパンは寝てる。"],["*yawn* … bread is closed. Come back at 7.","*esner* … ekmek kapalı. Sabah 7'de gel.","*bostezo* … el pan está cerrado. Vuelve a las 7.","*gähn* … Brot hat geschlossen. Komm um 7 wieder.","*bâille* … le pain est fermé. Reviens à 7 h.","*bocejo* … o pão está fechado. Volte às 7.","*зевает* … хлеб закрыт. Приходи в 7.","*あくび*…パンは閉店。7時にまた来て。"],["Nothing good happens to bread after midnight.","Gece yarısından sonra ekmeğin başına iyi bir şey gelmez.","A medianoche nada bueno le pasa al pan.","Nach Mitternacht passiert Brot nichts Gutes.","Après minuit, rien de bon n'arrive au pain.","Depois da meia-noite nada de bom acontece com o pão.","После полуночи с хлебом ничего хорошего не случается.","深夜0時を過ぎるとパンにいいことは起きない。"],["The bakery is just opening. I'm SO fresh right now.","Fırın yeni açılıyor. Şu an ÇOK tazeyim.","La panadería está abriendo. Estoy SÚPER fresco.","Die Bäckerei macht gerade auf. Ich bin SO frisch.","La boulangerie ouvre. Je suis TELLEMENT frais.","A padaria está abrindo. Estou MUITO fresquinho.","Пекарня только открывается. Я СУПЕРсвежий.","パン屋が開くところ。今めっちゃ焼きたて。"],["Early bird gets the bread. That's you.","Erken kalkan ekmeği kapar. O da sensin.","Al que madruga, pan le toca. Ese eres tú.","Der frühe Vogel kriegt das Brot. Das bist du.","L'avenir appartient à ceux qui se lèvent tôt. C'est toi.","Deus ajuda quem cedo madruga. É você.","Кто рано встаёт, тому хлеб достаётся. Это ты.","早起きはパンの得。きみのこと。"],["The simit sellers are setting up outside.","Simitçiler dışarıda tezgâh kuruyor.","Los vendedores de simit se instalan afuera.","Draußen bauen die Simit-Verkäufer auf.","Les vendeurs de simit s'installent dehors.","Os vendedores de simit estão se arrumando lá fora.","На улице раскладываются продавцы симитов.","外でシミット売りが準備中。"],["Good morning, {city}! Breakfast time!","Günaydın {city}! Kahvaltı zamanı!","¡Buenos días, {city}! ¡Hora del desayuno!","Guten Morgen, {city}! Frühstückszeit!","Bonjour {city} ! C'est l'heure du petit-déj !","Bom dia, {city}! Hora do café!","Доброе утро, {city}! Время завтрака!","おはよう、{city}！朝ごはんの時間！"],["Put some cheese and olives next to me.","Yanıma biraz peynir ve zeytin koy.","Ponme algo de queso y aceitunas al lado.","Leg etwas Käse und Oliven neben mich.","Mets du fromage et des olives à côté de moi.","Coloca um queijo e umas azeitonas do meu lado.","Положи рядом со мной сыр и оливки.","チーズとオリーブを横に置いて。"],["I'm at peak freshness. Enjoy it.","Tazeliğimin zirvesindeyim. Tadını çıkar.","Estoy en mi punto máximo de frescura. Disfrútalo.","Ich bin auf dem Höhepunkt der Frische. Genieß es.","Je suis au top de la fraîcheur. Profites-en.","Estou no auge do frescor. Aproveite.","Я на пике свежести. Наслаждайся.","今が一番新鮮。楽しんで。"],["It's lunchtime somewhere. Probably here.","Bir yerde öğle yemeği vakti. Muhtemelen burada.","En algún lugar es hora de comer. Probablemente aquí.","Irgendwo ist Mittagszeit. Wahrscheinlich hier.","Quelque part, c'est l'heure du déjeuner. Sûrement ici.","Em algum lugar é hora do almoço. Provavelmente aqui.","Где-то сейчас обед. Наверное, здесь.","どこかでお昼の時間。たぶんここ。"],["Afternoon. I'm getting slightly less fresh. Don't tell anyone.","Öğleden sonra. Biraz bayatlıyorum. Kimseye söyleme.","Por la tarde. Me estoy poniendo un poco menos fresco. No se lo digas a nadie.","Nachmittag. Ich werde etwas weniger frisch. Sag's keinem.","Après-midi. Je suis un peu moins frais. Ne le dis à personne.","Tarde. Estou ficando um pouco menos fresco. Não conta pra ninguém.","День. Я становлюсь чуть менее свежим. Никому не говори.","午後。ちょっと鮮度が落ちてきた。内緒ね。"],["Nice day in {city}, huh?","{city}'da güzel bir gün, değil mi?","Buen día en {city}, ¿eh?","Schöner Tag in {city}, oder?","Belle journée à {city}, hein ?","Dia bonito em {city}, né?","Хороший день в {city}, да?","{city}はいい天気だね？"],["Dinner time. I go well with soup.","Akşam yemeği vakti. Çorbayla iyi giderim.","Hora de cenar. Voy bien con sopa.","Abendessenszeit. Ich passe gut zu Suppe.","L'heure du dîner. Je vais bien avec la soupe.","Hora do jantar. Combino com sopa.","Время ужина. Я хорошо иду с супом.","夕ごはんの時間。スープに合うよ。"],["The sun is setting. So is my freshness.","Güneş batıyor. Tazeliğim de.","El sol se pone. Mi frescura también.","Die Sonne geht unter. Meine Frische auch.","Le soleil se couche. Ma fraîcheur aussi.","O sol está se pondo. Meu frescor também.","Солнце садится. Моя свежесть тоже.","日が沈む。私の鮮度も。"],["Evening in {city}. The bread lights are on.","{city}'da akşam. Ekmek ışıkları yandı.","Atardece en {city}. Las luces del pan se encienden.","Abend in {city}. Die Brotlichter sind an.","Soir à {city}. Les lumières du pain sont allumées.","Noite em {city}. As luzes do pão estão acesas.","Вечер в {city}. Хлебные огни зажглись.","{city}の夕方。パンの明かりがついた。"],["It's {hm}. Shouldn't you be in bed?","Saat {hm}. Yatakta olman gerekmiyor mu?","Son las {hm}. ¿No deberías estar en la cama?","Es ist {hm}. Solltest du nicht im Bett sein?","Il est {hm}. Tu ne devrais pas être au lit ?","São {hm}. Você não devia estar na cama?","Уже {hm}. Разве тебе не пора спать?","もう{hm}。寝てなくていいの？"],["Late-night toast? I see what you're doing.","Gece yarısı tost mu? Ne yaptığını görüyorum.","¿Tostada a medianoche? Ya veo lo que haces.","Nachts noch toasten? Ich sehe, was du tust.","Un toast tard le soir ? Je vois ce que tu fais.","Torrada de madrugada? Tô vendo o que você tá fazendo.","Ночной тост? Я вижу, что ты задумал.","夜食のトースト？わかってるよ。"],["I'm getting sleepy… keep clicking quietly.","Uykum geliyor… sessizce tıklamaya devam et.","Me está dando sueño… sigue haciendo clic en silencio.","Ich werde müde… klick leise weiter.","J'ai sommeil… continue à cliquer doucement.","Estou ficando com sono… continua clicando baixinho.","Мне хочется спать… продолжай нажимать тихо.","眠くなってきた…静かにクリックしてて。"],["Regular Bread","Normal Ekmek","Pan normal","Normales Brot","Pain normal","Pão comum","Обычный хлеб","ふつうのパン"],["Whole Wheat Bread","Tam Buğday Ekmeği","Pan integral","Vollkornbrot","Pain complet","Pão integral","Цельнозерновой хлеб","全粒粉パン"],["Slightly Squished Bread","Biraz Ezilmiş Ekmek","Pan un poco aplastado","Leicht zerdrücktes Brot","Pain un peu écrasé","Pão meio amassado","Слегка помятый хлеб","ちょっとつぶれたパン"],["Mini Bread","Mini Ekmek","Minipán","Mini-Brot","Mini-pain","Mini pão","Мини-хлеб","ミニパン"],["Already Toasted Bread","Zaten Kızarmış Ekmek","Pan ya tostado","Schon getoastetes Brot","Pain déjà grillé","Pão já torrado","Уже
