"dvd">🍞 BREAD</div><div id="ach"></div> <script>(()=>{const i=e=>document.getElementById(e),na="M22 125 Q20 85 55 72 L95 58 Q115 45 140 46 Q160 32 190 34 Q215 22 245 34 Q290 52 298 95 Q305 140 270 165 Q220 192 140 192 Q55 194 30 165 Q20 150 22 125Z";["shape","outline","shapeClip"].forEach(e=>i(e).setAttribute("d",na));const $t="M148 165 Q163 174 178 162",U={common:{c:"#9a8f80",w:55},uncommon:{c:"#3c9a4a",w:27},rare:{c:"#2f74d0",w:11},epic:{c:"#8a3fd1",w:5},legendary:{c:"#e08a00",w:1.8},mythic:{c:"linear-gradient(90deg,#ff4d8d,#7a5cff,#2bd2ff)",w:.2}},h=[{id:"regular",name:"Regular Bread",r:"common",grad:["#d9731f","#eab05a","#f8e2b8","#fdf0d6"],out:"#b25c40",sl:"#ffd6b5",sp:["#8a4a14","#fff3d6"],n:260,lines:["I'm the most normal bread you'll ever meet."]},{id:"wheat",name:"Whole Wheat Bread",r:"common",grad:["#8a4f22","#a8693a","#c99b6e","#dcbb92"],out:"#6b3a22",sl:"#e8c6a0",sp:["#4a2810","#e7d3b0"],n:420,lines:["I'm healthy. Nobody likes me for it.","Fiber. That's my whole personality."]},{id:"squished",name:"Slightly Squished Bread",r:"common",grad:["#d9731f","#eab05a","#f8e2b8","#fdf0d6"],out:"#b25c40",sl:"#ffd6b5",sp:["#8a4a14","#fff3d6"],n:240,sy:.72,lines:["Someone put the groceries on top of me.","I'm fine. I'm flat, but fine."]},{id:"mini",name:"Mini Bread",r:"common",p:620,grad:["#d9731f","#eab05a","#f8e2b8","#fdf0d6"],out:"#b25c40",sl:"#ffd6b5",sp:["#8a4a14","#fff3d6"],n:200,sx:.6,sy:.6,lines:["I'm small but I'm full of carbs.","Don't eat me in one bite. Please.","I'm not a crumb. I'm a bread."]},{id:"toast",name:"Already Toasted Bread",r:"common",p:260,grad:["#7a3a12","#a8602a","#c9874a","#d8a36a"],out:"#5a2a14",sl:"#c48a5a",sp:["#3a1a08","#e0b080"],n:260,lines:["I came pre-toasted. Save your time.","Life already burned me once."]},{id:"stale",name:"Day-Old Bread",r:"common",p:240,grad:["#b8946a","#c8aa84","#dccbb0","#e4d8c4"],out:"#8a7058",sl:"#e8dcc8",sp:["#7a6248","#f0e8da"],n:200,lines:["I was fresh yesterday. Yesterday was a good day.","Dip me in tea
